<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Rectify Jabre</title>
<link rel="stylesheet" href="../theme.css">
<style>
  html, body {
    width: 520px; height: 360px;
    background: #060606;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #3a3a3a;
    overflow: hidden;
  }
  .splash {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
  }
  .logo-img {
    width: 108px; height: 108px;
    margin-bottom: 14px;
    filter: drop-shadow(0 0 18px rgba(176,20,24,0.35));
  }
  .wordmark { text-align: center; }
  .wordmark .top {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 30px; color: #eee; letter-spacing: 1px;
  }
  .wordmark .bottom {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 30px; color: var(--red); font-style: italic; letter-spacing: 1px;
    margin-top: -6px;
  }
  .status {
    margin-top: 26px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: #999;
    letter-spacing: 1px;
  }
  .barwrap {
    margin-top: 10px;
    width: 260px; height: 6px;
    background: #1a1a1a;
    border: 1px solid #3a3a3a;
  }
  .bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--red-dark), var(--red-bright));
    animation: load 2.1s ease-in-out forwards;
  }
  @keyframes load { from { width: 0%; } to { width: 100%; } }
  .version {
    position: absolute; bottom: 10px; right: 14px;
    font-family: var(--font-mono);
    font-size: 10px; color: #555;
  }
  .copyright {
    position: absolute; bottom: 10px; left: 14px;
    font-family: var(--font-mono);
    font-size: 10px; color: #444;
  }
</style>
</head>
<body>
  <div class="splash">
    <img class="logo-img" src="../../assets/logo.png" onerror="this.style.display='none'">
    <div class="wordmark">
      <div class="top">Rectify<span style="font-size:14px;vertical-align:top;">&trade;</span></div>
      <div class="bottom">jabre</div>
    </div>
    <div class="status" id="status">INITIALIZING SESSION...</div>
    <div class="barwrap"><div class="bar"></div></div>
    <div class="version" id="version">v1.0.0</div>
    <div class="copyright">&copy; RECTIFY JABRE TERMINAL SYSTEMS</div>
  </div>
  <script src="splash.js"></script>
</body>
</html>
